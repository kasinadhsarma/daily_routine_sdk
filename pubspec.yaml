name: daily_routine_sdk
description: >
  Shared SDK (Auth, Firestore data layer, local reminders, and cross-platform
  app/process blocking) for Daily Routine clients.
version: 0.1.0
homepage: https://github.com/kasinadhsarma/daily_routine
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  equatable: ^2.0.7
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.0
  http: ^1.2.0
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kasinadhsarma.dailyroutine.daily_routine_sdk
        pluginClass: AppBlockerPlugin
      linux:
        dartPluginClass: DesktopAppBlockerService
      macos:
        dartPluginClass: DesktopAppBlockerService
      windows:
        dartPluginClass: DesktopAppBlockerService
